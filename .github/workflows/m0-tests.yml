name: Core Simulation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Run M0 100-season batch
        run: dart run tool/run_m0_batch.dart 100

      - name: Run M1 20-season career
        run: dart run tool/run_m1_career.dart 20260903

      - name: Run M2 20-season player career
        run: dart run tool/run_m2_player_career.dart 20260903

      - name: Run M3 20-season economy career
        run: dart run tool/run_m3_economy_career.dart 20260903

      - name: Run M4 20-season transfer career
        run: dart run tool/run_m4_transfer_career.dart 20260903

      - name: Run M5 20-season world career
        run: dart run tool/run_m5_world_career.dart 20260903

      - name: Run M6 20-season manager career
        run: dart run tool/run_m6_manager_career.dart 20260903

      - name: Run M7 20-season contract career
        run: dart run tool/run_m7_contract_career.dart 20260903

      - name: Run M8 20-season advanced transfer career
        run: dart run tool/run_m8_advanced_transfer_career.dart 20260903

      - name: Run M9 20-season fan career
        run: dart run tool/run_m9_fan_career.dart 20260903

      - name: Run M10 20-season media career
        run: dart run tool/run_m10_media_career.dart 20260903

      - name: Run M11 20-season promise career
        run: dart run tool/run_m11_promise_career.dart 20260903

      - name: Run M12 20-season promise fan career
        run: dart run tool/run_m12_promise_fan_career.dart 20260903

      - name: Run M13 20-season promise media career
        run: dart run tool/run_m13_promise_media_career.dart 20260903

      - name: Run M14 20-season presidential election career
        run: dart run tool/run_m14_president_election_career.dart 20260903

      - name: Run M15 20-season president tenure career
        run: dart run tool/run_m15_president_tenure_career.dart 20260903

      - name: Run M16 20-season president reputation career
        run: dart run tool/run_m16_president_reputation_career.dart 20260903

      - name: Run M17 20-season president management profile career
        run: dart run tool/run_m17_president_management_career.dart 20260903

      - name: Run M18 20-season president manager patience career
        run: dart run tool/run_m18_president_manager_patience_career.dart 20260903

      - name: Run M19 20-season president manager election feedback career
        run: dart run tool/run_m19_president_manager_election_feedback.dart 20260903

      - name: Run M20 20-season president financial discipline feedback career
        run: dart run tool/run_m20_president_financial_discipline_feedback.dart 20260903
