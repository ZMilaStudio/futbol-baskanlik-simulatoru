name: Core Simulation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Run M0 100-season batch
        run: dart run tool/run_m0_batch.dart 100

      - name: Run M1 20-season career
        run: dart run tool/run_m1_career.dart 20260903

      - name: Run M2 20-season player career
        run: dart run tool/run_m2_player_career.dart 20260903
