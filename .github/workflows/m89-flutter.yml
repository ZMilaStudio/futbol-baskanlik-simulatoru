name: M89 Flutter App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/m89-flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/m89-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-stage-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Launch debug APK on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n com.zmilastudio.futbol_baskanlik_app/.MainActivity
            sleep 5
            test -n "$(adb shell pidof com.zmilastudio.futbol_baskanlik_app | tr -d '\r')"
            echo "M89_FLUTTER_ANDROID_LAUNCH_PASS package=com.zmilastudio.futbol_baskanlik_app"

      - name: Verify built debug APK identity and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          mkdir -p dist reports
          cp "$APK" dist/FBS-M101-debug.apk
          printf '%s\n' "$GITHUB_SHA" > reports/APK_SOURCE_SHA.txt
          sha256sum dist/FBS-M101-debug.apk > reports/APK_SHA256.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging dist/FBS-M101-debug.apk > reports/APK_BADGING.txt
          grep -Fq "package: name='com.zmilastudio.futbol_baskanlik_app' versionCode='1' versionName='0.1.0'" reports/APK_BADGING.txt
          grep -Fxq "targetSdkVersion:'36'" reports/APK_BADGING.txt
          cat reports/APK_SOURCE_SHA.txt reports/APK_SHA256.txt
          echo "FBS_DEBUG_APK_IDENTITY_VERIFIED package=com.zmilastudio.futbol_baskanlik_app versionCode=1 targetSdk=36"

      - name: Upload installable debug APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: FBS-M101-debug-apk-${{ github.sha }}
          path: |
            dist/FBS-M101-debug.apk
            reports/APK_SOURCE_SHA.txt
            reports/APK_SHA256.txt
            reports/APK_BADGING.txt
          if-no-files-found: error
          retention-days: 14
