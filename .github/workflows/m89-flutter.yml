name: M89 Flutter App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/m89-flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/m89-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-stage-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Launch debug APK on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n com.zmilastudio.futbol_baskanlik_app/.MainActivity
            sleep 5
            test -n "$(adb shell pidof com.zmilastudio.futbol_baskanlik_app | tr -d '\r')"
            echo "M89_FLUTTER_ANDROID_LAUNCH_PASS package=com.zmilastudio.futbol_baskanlik_app"
