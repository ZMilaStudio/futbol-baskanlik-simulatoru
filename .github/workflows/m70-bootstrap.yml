name: M70 Bootstrap

on:
  push:
    branches: [feat/m70-crisis-unified-player-president-runtime]
    paths:
      - '.github/workflows/m70-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/m70-crisis-unified-player-president-runtime

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Apply M70 seams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          m65 = 'lib/src/facility/player_president_tenure_gated_ticket_pricing_runtime_integration.dart'
          replace_once(m65, "import '../crisis/facility_sponsor_crisis_runtime_composition.dart';\n", "import '../crisis/crisis_runtime_integration.dart';\nimport '../crisis/facility_sponsor_crisis_runtime_composition.dart';\n")
          replace_once(m65, "    this.sponsorSystem = const SponsorSystemEngine(),\n    this.sourceEngine = const PromiseMediaCareerEngine(),\n", "    this.sponsorSystem = const SponsorSystemEngine(),\n    this.crisisIntegration = const CrisisRuntimeIntegrationEngine(),\n    this.sourceEngine = const PromiseMediaCareerEngine(),\n")
          replace_once(m65, "  final SponsorSystemEngine sponsorSystem;\n  final PromiseMediaCareerEngine sourceEngine;\n", "  final SponsorSystemEngine sponsorSystem;\n  final CrisisRuntimeIntegrationEngine crisisIntegration;\n  final PromiseMediaCareerEngine sourceEngine;\n")
          replace_once(m65, "        sponsorSystem: sponsorSystem,\n        baseWorldEngine: pricedWorld,\n        sourceEngine: sourceEngine,\n", "        sponsorSystem: sponsorSystem,\n        baseWorldEngine: pricedWorld,\n        crisisIntegration: crisisIntegration,\n        sourceEngine: sourceEngine,\n")

          m68 = 'lib/src/facility/player_president_tenure_gated_facility_promise_media_transfer_ticket_pricing_runtime_composition.dart'
          replace_once(m68, "import '../crisis/facility_sponsor_crisis_runtime_composition.dart';\n", "import '../crisis/crisis_runtime_integration.dart';\nimport '../crisis/facility_sponsor_crisis_runtime_composition.dart';\n")
          replace_once(m68, "    this.investment = const PresidentFacilityInvestmentRuntimeEngine(),\n    this.sponsorSystem = const SponsorSystemEngine(),\n", "    this.investment = const PresidentFacilityInvestmentRuntimeEngine(),\n    this.sponsorSystem = const SponsorSystemEngine(),\n    this.crisisIntegration = const CrisisRuntimeIntegrationEngine(),\n")
          replace_once(m68, "  final PresidentFacilityInvestmentRuntimeEngine investment;\n  final SponsorSystemEngine sponsorSystem;\n", "  final PresidentFacilityInvestmentRuntimeEngine investment;\n  final SponsorSystemEngine sponsorSystem;\n  final CrisisRuntimeIntegrationEngine crisisIntegration;\n")
          replace_once(m68, "      sponsorSystem: sponsorSystem,\n      sourceEngine: sourceEngine,\n", "      sponsorSystem: sponsorSystem,\n      crisisIntegration: crisisIntegration,\n      sourceEngine: sourceEngine,\n")

          m69 = 'lib/src/sponsor/player_president_tenure_gated_facility_sponsor_promise_media_transfer_ticket_pricing_runtime_composition.dart'
          replace_once(m69, "import '../crisis/player_president_facility_control.dart';\n", "import '../crisis/crisis_runtime_integration.dart';\nimport '../crisis/player_president_facility_control.dart';\n")
          replace_once(m69, "    this.investment = const PresidentFacilityInvestmentRuntimeEngine(),\n  });\n", "    this.investment = const PresidentFacilityInvestmentRuntimeEngine(),\n    this.crisisIntegration = const CrisisRuntimeIntegrationEngine(),\n  });\n")
          replace_once(m69, "  final PresidentFacilityInvestmentRuntimeEngine investment;\n", "  final PresidentFacilityInvestmentRuntimeEngine investment;\n  final CrisisRuntimeIntegrationEngine crisisIntegration;\n")
          replace_once(m69, "      sponsorSystem: sponsorSystem,\n    );\n", "      sponsorSystem: sponsorSystem,\n      crisisIntegration: crisisIntegration,\n    );\n")

          workflow = '.github/workflows/m0-tests.yml'
          replace_once(workflow, "      - name: Run M69 player president facility sponsor promise media transfer ticket runtime composition\n        run: dart run tool/run_m69_player_president_tenure_gated_facility_sponsor_promise_media_transfer_ticket_pricing_runtime_composition.dart 20260903\n", "      - name: Run M69 player president facility sponsor promise media transfer ticket runtime composition\n        run: dart run tool/run_m69_player_president_tenure_gated_facility_sponsor_promise_media_transfer_ticket_pricing_runtime_composition.dart 20260903\n\n      - name: Run M70 player president facility sponsor crisis promise media transfer ticket runtime composition\n        run: dart run tool/run_m70_player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition.dart 20260903\n")

          summary = 'GENEL_PROJE_OZETI.md'
          replace_once(summary, "**M0–M69 CLOSED / MERGED / PASS ve `main` üzerindedir.**\n\n**Aktif milestone yok.**", "**M0–M69 CLOSED / MERGED / PASS ve `main` üzerindedir.**\n\n**Aktif milestone: M70 — Player President Tenure-Gated Facility + Sponsor + Crisis + Promise/Media + Transfer/Ticket Pricing Runtime Composition I — IMPLEMENTATION / CI PENDING.**\n\nM70 canlı `main` taramasında M59'un M69/M65 authoritative checkpoint dışında kalan iki player-control parçasından crisis yolunun, manager yoluna göre daha dar ve mevcut M47 `CrisisRuntimeIntegrationEngine` seam'i üzerinden güvenli biçimde compose edilebilir olduğu doğrulanarak seçildi. M70 yeni checkpoint/save codec yaratmaz; M65 authoritative kalır. Crisis provider yalnız controlled club, gerçek crisis ve persisted incumbent ownership eşleşmesinde çalışır; diğer 47 kulüp canonical AI parity'de kalır. Manager player-control entegrasyonu kapsam dışıdır.")
          PY

      - name: Format M70 Dart
        run: >-
          dart format
          lib/src/facility/player_president_tenure_gated_ticket_pricing_runtime_integration.dart
          lib/src/facility/player_president_tenure_gated_facility_promise_media_transfer_ticket_pricing_runtime_composition.dart
          lib/src/sponsor/player_president_tenure_gated_facility_sponsor_promise_media_transfer_ticket_pricing_runtime_composition.dart
          lib/src/crisis/player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition.dart
          lib/player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition.dart
          test/m70_player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition_test.dart
          tool/run_m70_player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition.dart

      - name: Analyze
        run: dart analyze

      - name: Run M70 acceptance tests
        run: dart test test/m70_player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition_test.dart

      - name: Run M70 canonical marker
        run: dart run tool/run_m70_player_president_tenure_gated_facility_sponsor_crisis_promise_media_transfer_ticket_pricing_runtime_composition.dart 20260903

      - name: Commit verified M70 implementation
        shell: bash
        run: |
          rm .github/workflows/m70-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(m70): compose crisis control into unified player-president runtime"
          git push origin HEAD:feat/m70-crisis-unified-player-president-runtime
